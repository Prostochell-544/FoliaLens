[package]
name = "atlas_core"
version = "0.1.0"
edition = "2021"

[lib]
# `rlib` lets in-crate binaries (build-atlas) link against the library.
crate-type = ["cdylib", "staticlib", "rlib"]
name = "atlas_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[[bin]]
name = "build-atlas"
path = "src/bin/build_atlas.rs"

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
jni = "0.21"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
zstd = "0.13"
h3o = "0.6"
rustfft = "6.2"
fast_image_resize = "4.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
